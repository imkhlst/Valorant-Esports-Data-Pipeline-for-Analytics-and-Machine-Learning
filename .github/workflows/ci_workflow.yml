name: Data Pipeline CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: 'read'
  actions: ['read', 'write']

jobs:

  scrape-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download previous scrape state
        if: ${{ inputs.previous_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: scraper_state
          run-id: ${{ inputs.previous_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: data/
          
      - name: Build docker image
        run: docker build -t valorant-project .

      - name: Validate scraper container
        run: |
          docker run --rm \
          valorant-project \
          python -c "import pipeline.scraper_pipeline; print('Scraper container OK')"

      - name: Run scraper pipeline
        run: |
          docker run --rm \
          -v "${{ github.workspace }}/data:/valorant-project/data" \
          -v "${{ github.workspace }}/logs:/valorant-project/logs" \
          valorant-project \
          python -m pipeline.scraper_pipeline --ci

      - name: Validate scraper_state
        if: always()
        run: |
          echo "=== Raw Data ==="
          find data/raw -type f || true

          echo "=== Checkpoint ==="
          find data/checkpoint -type f || true

      - name: Upload scraper state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper_state
          path: data/
          if-no-files-found: error

      - name: Read pipeline state
        id: pipeline_state
        if: success()
        shell: bash
        run: |
          STATUS=$(python -c "
          import json
          with open('data/checkpoint/pipeline_state.json') as file:
            state = json.load(file)
          print(state['pipeline_status'])
          ")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      
      - name: Trigger next scraping run
        if: steps.pipeline_state.outputs.status == 'in_progress'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run scraper_ci.yml \
          --ref main \
          -f previous_run_id=${{ github.run_id }}

  gcp-run:
      runs-on: ubuntu-latest
      needs: scrape-run
      if: ${{ github.event.workflow_run.conclusion == 'success' }}

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        - name: Download scraped data artifact
          uses: actions/download-artifact@v5
          with:
            name: scraper_state
            path: data/
            run-id: ${{ github.event.workflow_run.id }}
            github-token: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Validate uploaded data
          run: |
            find data/raw -type f

        - name: Authenticate to Google Cloud
          uses: google-github-actions/auth@v3
          with:
            workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

        - name: Build Docker Image
          run: docker build -t valorant-project .

        - name: Validate GCP container
          run: |
            docker run --rm \
            valorant-project \
            python -c "import utils.gcp_utils; print('GCP container OK!')"

        - name: Run GCP pipeline
          run: |
            docker run --rm \
            -v "${{ github.workspace }}/data/raw:/valorant-project/data/raw" \
            -v "$GOOGLE_APPLICATION_CREDENTIALS:/tmp/gcp-credentials.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json \
            valorant-project \
            python -m pipeline.gcp_pipeline --ci

  dbt-run:
      runs-on: ubuntu-latest
      needs: gcp-run
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dbt
          run: pip install dbt-bigquery==1.12.0

        - name: Authenticate to Google Cloud
          uses: google-github-actions/auth@v3
          with:
            workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

        - name: Create dbt Profile
          run: |
            mkdir ~/.dbt
            
            cat > ~/.dbt/profiles.yml << 'EOF'
            valorant:
              target: ci
              outputs:
                ci:
                  dataset: ci_silver
                  location: asia-southeast2
                  method: oauth
                  priority: interactive
                  project: valorant-project-2026
                  threads: 4
                  type: bigquery
            EOF

        - name: Install dbt Packages
          working-directory: ./valorant
          run: dbt deps

        - name: Check dbt Connection
          working-directory: ./valorant
          run: dbt debug --target ci

        - name: Run dbt build
          working-directory: ./valorant
          run: dbt build --target ci