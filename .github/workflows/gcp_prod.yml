name: GCP - Production

on:
  workflow_run:
    workflows: ["Scraper - Production"]
    types:
      - completed

permissions:
  contents: 'read'
  actions: 'read'
  id-token: 'write'

jobs:

  gcp-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download scraped data artifact
        uses: actions/download-artifact@v5
        with:
          name: scraper_state
          path: data/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate uploaded data
        if: steps.scraper_state.outputs.status == 'completed'
        run: |
          find data/raw -type f

      - name: Validate scraper completion
        id: scraper_state
        run: |
          STATUS=$(python -c "
          import json
          with open('data/checkpoint/pipeline_state.json') as file:
              state = json.load(file)
          print(state['pipeline_status'])
          ")

          echo "Scraper pipeline status: $STATUS"
          
          if [ "$STATUS" != 'completed' ]; then
            echo "Scraper pipeline is not completed."
            echo "Skipping GCP ingestion."
            exit 1
          fi

          echo "Scraper pipeline completed."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build Docker Image
        run: docker build -t valorant-project .

      - name: Validate GCP container
        run: |
          docker run --rm \
          valorant-project \
          python -c "import utils.gcp_utils; print('GCP container OK!')"

      - name: Run GCP pipeline
        run: |
          docker run --rm \
          -v "${{ github.workspace }}/data/raw:/valorant-project/data/raw" \
          -v "$GOOGLE_APPLICATION_CREDENTIALS:/tmp/gcp-credentials.json:ro" \
          -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json \
          valorant-project \
          python -m pipeline.gcp_pipeline --prod