name: GCP Pipeline

# on:
  # workflow_run:
    # workflows: ["Scraper Pipeline"]
    # type:
    # - completed

permissions:
  contents: 'read'
  id-token: 'write'

jobs:

  gcp-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download scraped data artifact
        uses: actions/download-artifact@v4
        with:
          name: scraped-data
          path: data/raw/
      
      - name: Validate uploaded data
        run: |
          find data/raw -type f

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build Docker Image
        run: docker build -t valorant-project .

      - name: Validate GCP container
        run: |
          docker run --rm \
          valorant-project \
          python -c "import utils.gcp_utils; print('GCP container OK!')"

      - name: Run GCP pipeline
        run: |
          docker run --rm \
          -v "${{ github.workspace }}/data/raw:/valorant-project/data/raw" \
          -v "$GOOGLE_APPLICATION_CREDENTIALS:/tmp/gcp-credentials.json:ro" \
          -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json \
          valorant-project \
          python -m pipeline.gcp_pipeline