name: Run Data Pipeline

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t valorant-project .

      - name: Validate Scraper Container
        run: |
          docker run --rm \
          valorant-project \
          python -c "import pipeline.scraper_pipeline; print('Scraper container OK')"

