              arguments:
                to: ref('dims_tours')
                field: tour_id
      - name: tour_name
        description: >
          Official name of the tournament.
        data_type: string
        data_tests:
          - not_null
      - name: tour_region
        description: >
          Regional scope of the tournament.
        data_type: string
        data_tests:
          - not_null
      - name: match_id
        description: >
          Identifier of the match containing the game.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_matches')
                field: match_id
      - name: match_date
        description: >
          Calendar date on which the match took place.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time when the match took place.
        data_type: datetime
        data_tests:
          - not_null
      - name: bracket
        description: >
          Tournament bracket or stage position in which the match was played.
        data_type: string
        data_tests:
          - not_null
      - name: team_id
        description: >
          Identifier of the home team participating in the match.
          Foreign key referencing the team dimension.
        data_type: int64
        data_tests:
          - not_null
      - name: team_name
        description: >
          Standardized full name of the team.
        data_type: string
        data_tests:
          - not_null
      - name: team_alias
        description: >
          Standardized short alias used to identify the team.
        data_type: string
        data_tests:
          - not_null
      - name: bo
        description: >
          Match format indicating the number of games that can be played,
          such as Best-of-1 (bo1), Best-of-3 (bo3), or Best-of-5 (bo5).
        data_type: string
        data_tests:
          - not_null
      - name: patch
        description: >
          Game patch associated with the match. May be NULL when
          patch information was unavailable in the source data.
        data_type: string
      - name: score
        description: >
          Number of games won by the team in the match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_round
        description: >
          Total number of rounds won by the team across games included in the match.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: h2h_win
        description: >
          Number of previous head-to-head matches won by the team against the opposing team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: h2h_score
        description: >
          Total games won by the team in previous head-to-head encounters.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: n_last_win
        description: >
          Number of previous win matches available for calculating the team recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: n_last_match
        description: >
          Number of previous matches available for calculating the team recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: n_last_match_wr
        description: >
          Recent win rate of the team based on the available previous matches.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_win
        description: >
          Binary outcome indicator equal to 1 when the team won the match and 0 otherwise.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

