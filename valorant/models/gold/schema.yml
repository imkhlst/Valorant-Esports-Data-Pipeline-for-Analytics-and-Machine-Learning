  - name: agents_maps_performance
    description: >
      Agent-level map performance model summarizing agent presence, selection,
      and win performance on each map.
      Grain: one row per agent per map.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
                - agent_id
                - map_id
    columns:
      - name: agent_id
        description: >
          Identifier of the agent.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_agents')
                field: agent_id
      - name: agent_name
        description: >
          Standardized name of the agent.
        data_type: string
        data_tests:
          - not_null
      - name: map_id
        description: >
          Identifier of the map.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_maps')
                field: map_id
      - name: map_name
        description: >
          Standardized name of the map.
        data_type: string
        data_tests:
          - not_null
      - name: presence_count
        description: >
          Number of player-agent appearances of the agent on the map.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: map_played
        description: >
          Number of games in which the map was played within the relevant agent statistics.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: pick_count
        description: >
          Number of times the agent was selected on the map.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_win
        description: >
          Number of wins recorded by the agent on the map.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: pick_rate
        description: >
          Proportion of eligible agent selections represented by the agent on the map.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: win_rate
        description: >
          Win rate associated with the agent on the map.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: presence_rate
        description: >
          Proportion of relevant games in which the agent was present on the map.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
  
  - name: agents_performance
    description: >
      Agent-level performance model summarizing agent selection frequency
      and win performance across the dataset.
      Grain: one row per agent.
    config:
      contract:
        enforced: true
    columns:
      - name: agent_id
        description: >
          Unique identifier of the agent.
        data_type: int64
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dims_agents')
                field: agent_id
      - name: agent_name
        description: >
          Standardized name of the agent.
        data_type: string
        data_tests:
          - not_null
      - name: pick_count
        description: >
          Total number of times the agent was selected.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_games
        description: >
          Total number of games included in the agent's performance calculation.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: pick_rate
        description: >
          Proportion of agent selections represented by this agent across the relevant games.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: win_rate
        description: >
          Win rate associated with the agent across the relevant games.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1