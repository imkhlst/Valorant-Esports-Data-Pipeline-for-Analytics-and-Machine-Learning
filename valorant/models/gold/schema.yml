version: 1.3

models:
  - name: dims_tours
    description: >
      Dimension table containing standardized tournament attributes used to
      identify and categorize tournaments.
      Grain: one row per tournament.
    config:
      contract:
        enforced: true
    columns:
    - name: tour_id
      description: >
        Unique identifier assigned to each tournament.
      data_type: int64
      data_tests:
      - not_null
      - unique
    - name: tour_name
      description: >
        Official name of the tournament.
      data_type: string
      data_tests:
      - not_null
      - unique
    - name: tour_tag
      description: >
        Short tag or abbreviation used to identify the tournament.
      data_type: string
      data_tests:
      - not_null
    - name: tour_stage
      description: >
        Competetion stage of the tournament, such a Kickoff, Stage 1, Stage 2 or Champions.
      data_type: string
      data_tests:
      - not_null
    - name: tour_region
      description: >
        Regional scope of the tournament, such as a specific region or All for globally contested events.
      data_type: string
      data_tests:
      - not_null
    - name: tour_status
      description: >
        Current or recorded status of the tournament, such as ongoing or completed.
      data_type: string
      data_tests:
      - not_null
      
  - name: dims_teams
    description: >
      Team dimension containing the standardized identity and regional classification of teams.
      Grain: one row per team.
    config:
      contract:
        enforced: true
    columns:
      - name: team_id
        description: >
          Surrogate identifier uniquely assigned to each team.
        data_type: int64
        data_tests:
          - not_null
          - unique
      - name: team_name
        description: >
          Standardized full name of the team.
        data_type: string
        data_tests:
          - not_null
      - name: team_alias
        description: >
          Standardized short alias used to identify the team in source data.
        data_type: string
        data_tests:
          - not_null
      - name: team_region
        description: >
          Competitive region associated with the team.
        data_type: string
        data_tests:
          - not_null

  - name: dims_players
    description: >
      Player dimension containing standardized player identities and nationality information.
      Grain: one row per player.
    config:
      contract:
        enforced: true
    columns:
      - name: player_id
        description: >
          Surrogate identifier uniquely assigned to each player.
        data_type: int64
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: >
          Standardized name of the player.
        data_type: string
        data_tests:
          - not_null
      - name: player_nationality
        description: >
          Nationality associated with the player.
        data_type: string
        data_tests:
          - not_null

  - name: dims_maps
    description: >
      Map dimension containing standardized identifiers and names for maps available in the dataset.
      Grain: one row per map.
    config:
      contract:
        enforced: true
    columns:
      - name: map_id
        description: >
          Surrogate identifier uniquely assigned to each map.
        data_type: int64
        data_tests:
          - not_null
          - unique
      - name: map_name
        description: >
          Standardized name of the map.
        data_type: string
        data_tests:
          - not_null
          - unique

  - name: dims_agents
    description: >
      Agent dimension containing standardized identifiers and names for playable agents.
      Grain: one row per agent.
    config:
      contract:
        enforced: true
    columns:
      - name: agent_id
        description: >
          Surrogate identifier uniquely assigned to each agent.
        data_type: int64
        data_tests:
          - not_null
          - unique
      - name: agent_name
        description: >
          Standardized name of the agent.
        data_type: string
        data_tests:
          - not_null
          - unique

  - name: fact_matches
    description: >
      Match-level fact table containing tournament, timing, team, format, score,
      head-to-head, and recent team performance information.
      Grain: one row per match.
    config:
      contract:
        enforced: true
    columns:
      - name: tour_id
        description: >
          Identifier of the tournament associated with the match.
          Foreign key referencing the tournament dimension.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_tours')
                field: tour_id
      - name: match_id
        description: >
          Unique identifier of the match.
          Represents the grain of this model: one row per match.
        data_type: int64
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('matches')
                field: match_id
      - name: match_date
        description: >
          Calendar date on which the match took place.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time at which the match took place.
        data_type: datetime
        data_tests:
          - not_null
      - name: bracket
        description: >
          Tournament bracket or stage position in which the match was played.
        data_type: string
        data_tests:
          - not_null
      - name: home_team_id
        description: >
          Identifier of the home team participating in the match.
          Foreign key referencing the team dimension.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_teams')
                field: team_id
      - name: away_team_id
        description: >
          Identifier of the away team participating in the match.
          Foreign key referencing the team dimension.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_teams')
                field: team_id
      - name: bo
        description: >
          Match format indicating the number of games that can be played,
          such as Best-of-1 (bo1), Best-of-3 (bo3), or Best-of-5 (bo5).
        data_type: string
        data_tests:
          - not_null
      - name: patch
        description: >
          Game patch associated with the match. May be NULL when
          patch information was unavailable in the source data.
        data_type: string
      - name: home_score
        description: >
          Number of games won by the home team in the match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_score
        description: >
          Number of games won by the away team in the match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: normalized_score_diff
        description: >
          Normalized difference between home and away match scores.
        data_type: float64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_total_round
        description: >
          Total number of rounds won by the home team across games included in the match.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_total_round
        description: >
          Total number of rounds won by the away team across games included in the match.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: normalized_match_round_diff
        description: >
          Normalized difference between the total rounds won by the home and away teams in the match.
        data_type: float64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_h2h_win
        description: >
          Number of previous head-to-head matches won by the home team against the opposing team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_h2h_win
        description: >
          Number of previous head-to-head matches won by the away team against the opposing team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: normalized_h2h_win_diff
        description: >
          Normalized difference in historical head-to-head win rate between the home and away teams.
          NULL represent both teams was never faces each other before.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_h2h_score
        description: >
          Total games won by the home team in previous head-to-head encounters.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_h2h_score
        description: >
          Total games won by the away team in previous head-to-head encounters.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: normalized_h2h_game_win_diff
        description: >
          Normalized difference in historical head-to-head game-level win rate between the home and away teams.
          NULL represent both teams was never faces each other before.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_n_last_win
        description: >
          Number of previous win matches available for calculating the home team's recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_n_last_win
        description: >
          Number of previous win matches available for calculating the away team's recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_n_last_match
        description: >
          Number of previous matches available for calculating the home team's recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_n_last_match
        description: >
          Number of previous matches available for calculating the away team's recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_n_last_wr
        description: >
          Recent win rate of the home team based on the available previous matches.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: away_n_last_wr
        description: >
          Recent win rate of the away team based on the available previous matches.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: is_home_win
        description: >
          Binary outcome indicator equal to 1 when the home team won the match and 0 otherwise.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
  
  - name: fact_games
    description: >
      Game-level fact table containing game outcome, round performance, side performance,
      overtime, pistol-round, and economy statistics for both teams.
      Grain: one row per game.
    config:
      contract:
        enforced: true
    columns:
      - name: tour_id
        description: >
          Identifier of the tournament containing the game.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
                arguments:
                  to: ref('fact_matches')
                  field: tour_id
      - name: match_id
        description: >
          Identifier of the match containing the game.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('games_overview')
                field: match_id
      - name: game_id
        description: >
          Unique identifier of the game.
          Represents the grain of this model: one row per game.
        data_type: int64
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('games_overview')
                field: game_id
      - name: match_date
        description: >
          Calendar date on which the match containing the game took place.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time at which the match containing the game took place.
        data_type: datetime
        data_tests:
          - not_null
      - name: home_team_id
        description: >
          Identifier of the home team in the game.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_teams')
                field: team_id
      - name: away_team_id
        description: >
          Identifier of the away team in the game.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_teams')
                field: team_id
      - name: map_id
        description: >
          Identifier of the map on which the game was played.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_maps')
                field: map_id
      - name: game_duration
        description: >
          Duration of the game in seconds.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: home_score
        description: >
          Total rounds won by the home team in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_score
        description: >
          Total rounds won by the away team in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0 
      - name: total_round
        description: >
          Total number of rounds played in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: normalized_score_diff
        description: >
          Normalized difference between home and away round scores.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_atk_score
        description: >
          Number of rounds won by the home team while attacking.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_atk_score
        description: >
          Number of rounds won by the away team while attacking.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: atk_wr_ratio
        description: >
          Ratio comparing the attacking-side win rates of the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_def_score
        description: >
          Number of rounds won by the home team while defending.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_def_score
        description: >
          Number of rounds won by the away team while defending.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: def_wr_ratio
        description: >
          Ratio comparing the defending-side win rates of the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_ot_score
        description: >
          Number of overtime rounds won by the home team.
          Null values represent overtime was not happens.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_ot_score
        description: >
          Number of overtime rounds won by the away team.
          Null values represent overtime was not happens.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: normalized_ot_score_diff
        description: >
          Normalization representing the relative overtime round performance between the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_pstl_win
        description: >
          Number of pistol rounds won by the home team.
        data_type: int64
        data_tests: 
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: away_pstl_win
        description: >
          Number of pistol rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: pstl_win_diff
        description: >
          Difference between the number of pistol rounds won by the home and away teams.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -2
                max_value: 2
      - name: home_eco_round
        description: >
          Number of eco rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_eco_round
        description: >
          Number of eco rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_eco_win
        description: >
          Number of eco rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_eco_win
        description: >
          Number of eco rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: eco_wr_diff
        description: >
          Relative difference in eco-round win rate between the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_semi_eco_round
        description: >
          Number of semi eco rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_eco_round
        description: >
          Number of semi eco rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_semi_eco_win
        description: >
          Number of semi eco rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_eco_win
        description: >
          Number of semi eco rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: semi_eco_wr_diff
        description: >
          Relative difference in semi-eco-round win rate between the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_semi_buy_round
        description: >
          Number of semi buy rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_buy_round
        description: >
          Number of semi buy rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_semi_buy_win
        description: >
          Number of semi buy rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_buy_win
        description: >
          Number of semi buy rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: semi_buy_wr_diff
        description: >
          Relative difference in semi-buy-round win rate between the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: home_full_buy_round
        description: >
          Number of full buy rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_full_buy_round
        description: >
          Number of full buy rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_full_buy_win
        description: >
          Number of full buy rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_full_buy_win
        description: >
          Number of full buy rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: full_buy_wr_diff
        description: >
          Relative difference in full-buy-round win rate between the home and away teams.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: is_home_win
        description: >
          Binary outcome indicator equal to 1 when the home team won the game and 0 otherwise.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
  
  - name: fact_map_vetos
    description: >
      Map veto fact table recording map bans, picks, and decider selections associated with each match.
      Grain: one row per map veto action.
    config:
      contract:
        enforced: true
    # data_tests: # invalid decider value for match_id 87374 and 89698, the correct one is Lotus. Check Liquipedia.
    #   - dbt_utils.unique_combination_of_columns:
    #       arguments:
    #         combination_of_columns: 
    #           - match_id
    #           - map_id
    #           - team_id
    columns:
      - name: match_id
        description: >
          Identifier of the match associated with the map veto action.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('matches')
                field: match_id
      - name: map_id
        description: >
          Identifier of the map involved in the veto action.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_maps')
                field: map_id
      - name: team_id
        description: >
          Identifier of the team performing the veto action.
          NULL for match-level actions such as the decider selection.
        data_type: int64
        data_tests:
          - relationships:
              arguments:
                to: ref('dims_teams')
                field: team_id
      - name: action
        description: >
          Type of map veto action performed, such as pick, ban, or decider.
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pick', 'ban', 'decider']
      - name: action_order
        description: >
          Sequential order of the veto action for a team and action type.
          NULL for decider selections.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
  
  - name: fact_players
    description: >
      Player-level fact table containing player identity, team, agent selection,
      match outcome, and individual performance statistics.
      Grain: one row per player per game.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tour_id
              - match_id
              - game_id
              - map_id
              - player_id
              - team_id
              - mod
    columns:
      - name: tour_id
        description: >
          Unique identifier of the tournament in which the player participated.
