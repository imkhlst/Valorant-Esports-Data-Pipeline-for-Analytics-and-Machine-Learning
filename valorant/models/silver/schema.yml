version: 1.3

models:
  - name: matches
    description: >
      Match-level dataset containing tournament context, match metadata,
      team identities, scores, and historical head-to-head statistics.
      Grain: one row per match.
    config:
      contract:
        enforced: true
    columns:
      - name: tour_id
        description: >
          Identifier of the tournament associated with the match.
          References the tournament dimension.
        data_type: int64
        data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dims_tours')
              field: tour_id
      - name: match_id
        description: >
          Unique identifier of the match. Represents the grain of this model:
          one row per match.
        data_type: int64
        data_tests:
          - not_null
          - unique
      - name: match_date
        description: >
          Calendar date on which the match took place, derived from
          match_datetime and used for date-based filtering or partitioning.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time when the match took place.
        data_type: datetime
        data_tests:
          - not_null
      - name: bracket
        description: >
          Tournament bracket or stage position in which the match was played.
        data_type: string
        data_tests:
          - not_null
      - name: home_name
        description: >
          Full name of the home team participating in the match.
        data_type: string
        data_tests:
          - not_null
      - name: home_alias
        description: >
          Short alias or abbreviation identifying the home team.
        data_type: string
        data_tests:
          - not_null
      - name: away_name
        description: >
          Full name of the away team participating in the match.
        data_type: string
        data_tests:
          - not_null
      - name: away_alias
        description: >
          Short alias or abbreviation identifying the away team.
        data_type: string
        data_tests:
          - not_null
      - name: bo
        description: >
          Match format indicating the number of games that can be played,
          such as Best-of-1 (bo1), Best-of-3 (bo3), or Best-of-5 (bo5).
        data_type: string
        data_tests:
          - not_null
      - name: patch
        description: >
          Game patch version under which the match was played.
        data_type: string
      - name: home_score
        description: >
          Number of games won by the home team in the match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_score
        description: >
          Number of games won by the away team in the match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_h2h_win
        description: >
          Number of previous head-to-head matches between the home team
          and away team won by the home team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_h2h_win
        description: >
          Number of previous head-to-head matches between the home team
          and away team won by the away team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_h2h_score
        description: >
          Number of previous head-to-head games won by the away team
          against the home team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_h2h_score
        description: >
          Number of previous head-to-head games won by the home team
          against the away team.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_n_last_win
        description: >
          Number of previous win matches available for calculating the home team's recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_n_last_win
        description: >
          Number of previous win matches available for calculating the away team's recent performance.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_n_last_match
        description: >
          Number of previous matches available in the historical window
          for the home team at the time of this match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_n_last_match
        description: >
          Number of previous matches available in the historical window
          for the away team at the time of this match.
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_n_last_wr
        description: >
          Number of previous matches available in the historical window
          for the home team at the time of this match.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: away_n_last_wr
        description: >
          Number of previous matches available in the historical window
          for the away team at the time of this match.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              
  - name: games_overview
    description: >
      Game-level overview containing match identification, game timing,
      map information, round scores, and attack, defense, and overtime
      performance for both teams.
      Grain: one row per game.
    config:
      contract:
        enforced: true
    columns:
      - name: match_id
        description: >
          Unique identifier of the match to which the game belongs.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('matches')
                field: match_id
      - name: game_id
        description: >
          Unique identifier of the game. Represents the grain of this model.
        data_type: int64
        data_tests:
          - not_null
          - unique
      - name: match_date
        description: >
          Calendar date on which the match was played.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time at which the match was played.
        data_type: datetime
        data_tests:
          - not_null
      - name: game_map
        description: >
          Map on which the game was played.
        data_type: string
        data_tests:
          - not_null
      - name: game_duration
        description: >
          Duration of the game in seconds.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_score
        description: >
          Total rounds won by the home team in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_score
        description: >
          Total rounds won by the away team in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_atk_score
        description: >
          Number of regulation and overtime-adjusted rounds won by the home team while attacking.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_atk_score
        description: >
          Number of regulation and overtime-adjusted rounds won by the away team while attacking.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_def_score
        description: >
          Number of regulation and overtime-adjusted rounds won by the home team while defending.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_def_score
        description: >
          Number of regulation and overtime-adjusted rounds won by the away team while defending.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_ot_score
        description: >
          Number of overtime rounds won by the home team.
          NULL values represent overtime was not happens.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_ot_score
        description: >
          Number of overtime rounds won by the away team.
          NULL values represent overtime was not happens.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: games_economy
    description: >
      Game-level economy statistics containing pistol, eco, semi-eco,
      semi-buy, and full-buy round and win statistics for both teams.
      Grain: one row per game.
    config:
      contract:
        enforced: true
    columns:
      - name: match_id
        description: >
          Unique identifier of the match to which the game belongs.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('matches')
                field: match_id
      - name: game_id
        description: >
          Unique identifier of the game.
        data_type: int64
        data_tests:
          - not_null
          - unique     
      - name: match_date
        description: >
          Calendar date on which the match was played.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time at which the match was played.
        data_type: datetime
        data_tests:
          - not_null
      - name: home_pstl_win
        description: >
          Number of pistol rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: away_pstl_win
        description: >
          Number of pistol rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 2
      - name: home_eco_round
        description: >
          Number of eco rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_eco_round
        description: >
          Number of eco rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_eco_win
        description: >
          Number of eco rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_eco_win
        description: >
          Number of eco rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_semi_eco_round
        description: >
          Number of semi eco rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_eco_round
        description: >
          Number of semi eco rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_semi_eco_win
        description: >
          Number of semi eco rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_eco_win
        description: >
          Number of semi eco rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_semi_buy_round
        description: >
          Number of semi buy rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_buy_round
        description: >
          Number of semi buy rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_semi_buy_win
        description: >
          Number of semi buy rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_semi_buy_win
        description: >
          Number of semi buy rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_full_buy_round
        description: >
          Number of full buy rounds played by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_full_buy_round
        description: >
          Number of full buy rounds played by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: home_full_buy_win
        description: >
          Number of full buy rounds won by the home team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: away_full_buy_win
        description: >
          Number of full buy rounds won by the away team.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: players
    description: >
      Player-level statistics for each game, including player identity,
      team, agent, and combat performance metrics.
      Grain: one row per player per game.
    config:
      contract:
        enforced: true
    columns:
      - name: game_id
        description: >
          Unique identifier of the game in which the player participated.
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('games_overview')
                field: game_id
      - name: match_date
        description: >
          Calendar date on which the match was played.
        data_type: date
        data_tests:
          - not_null
      - name: match_datetime
        description: >
          Date and time at which the match was played.
        data_type: datetime
        data_tests:
          - not_null
      - name: player_name
        description: >
          Name of the player.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_players')
                field: player_name
      - name: team_alias
        description: >
          Alias of the team represented by the player in the game.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_teams')
                field: team_alias
      - name: nationality
        description: >
          Nationality associated with the player.
        data_type: string
        data_tests:
          - not_null
      - name: agent
        description: >
          Agent selected by the player for the game.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dims_agents')
                field: agent_name
      - name: mod
        description: >
          Statistical aggregation mode indicating whether the player
          statistics represent overall, attacking-side, or defending-side
          performance.
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['avg', 'atk', 'def']
      - name: r
        description: >
          Player rating for the game.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: acs
        description: >
          Average Combat Score (ACS) achieved by the player in the game.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: k
        description: >
          Number of kills recorded by the player in the game.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: d
        description: >
          Number of deaths recorded by the player in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: a
        description: >
          Number of assists recorded by the player in the game.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: kd
        description: >
          Kill-to-death diff of the player in the game.
        data_type: int64
      - name: kast
        description: >
          Percentage of rounds in which the player recorded a kill,
          assist, survived, or was traded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: adr
        description: >
          Average Damage per Round (ADR) achieved by the player.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: hs
        description: >
          Percentage of the player's kills that were headshots.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: fk
        description: >
          Number of first kills recorded by the player.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: fd
        description: >
          Number of first deaths recorded by the player.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: fkfd
        description: >
          First-kill to first-death diff of the player.
        data_type: int64