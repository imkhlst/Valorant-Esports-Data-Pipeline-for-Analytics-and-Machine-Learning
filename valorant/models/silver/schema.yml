              min_value: 0

  - name: players
    description: >
      Player-level statistics for each game, including player identity,
      team, agent, and combat performance metrics.
      Grain: one row per player per game.
    columns:
      - name: game_id
        description: >
          Unique identifier of the game in which the player participated.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              to: ref('games_overview')
              field: game_id
      - name: player_name
        description: >
          Name of the player.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              to: ref('dims_players')
              field: player_name
      - name: team_alias
        description: >
          Alias of the team represented by the player in the game.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              to: ref('dims_teams')
              field: team_alias
      - name: nationality
        description: >
          Nationality associated with the player.
        data_type: string
        data_tests:
          - not_null
      - name: agent
        description: >
          Agent selected by the player for the game.
        data_type: string
        data_tests:
          - not_null
          - relationships:
              to: ref('dims_agents')
              field: agent_name
      - name: mod
        description: >
          Statistical aggregation mode indicating whether the player
          statistics represent overall, attacking-side, or defending-side
          performance.
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              values: ['avg', 'atk', 'def']
      - name: r
        description: >
          Player rating for the game.
          Values must be non-negative and must be float.
        data_type: float64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: acs
        description: >
          Average Combat Score (ACS) achieved by the player in the game.
          Values must be non-negative and must be integers.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: k
        description: >
          Number of kills recorded by the player in the game.
          Values must be non-negative and must be integers.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: d
        description: >
          Number of deaths recorded by the player in the game.
          Values must be non-negative and must be integers.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: a
        description: >
          Number of assists recorded by the player in the game.
          Values must be non-negative and must be integers.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: kd
        description: >
          Kill-to-death diff of the player in the game.
          Values must be integers.
        data_type: int64
      - name: kast
        description: >
          Percentage of rounds in which the player recorded a kill,
          assist, survived, or was traded.
          Values range from 0 to 100 and must be integers.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: adr
        description: >
          Average Damage per Round (ADR) achieved by the player.
          Values must be non-negative and must be integers.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: hs
        description: >
          Percentage of the player's kills that were headshots.
          Values range from 0 to 1 and must be integers.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: fk
        description: >
          Number of first kills recorded by the player.
          Values must be non-negative and must be integers.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: fd
        description: >
          Number of first deaths recorded by the player.
          Values must be non-negative and must be integers.
          NULL represent a failed transform due to anomaly value or data not recorded.
        data_type: int64
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
      - name: fkfd
        description: >
          First-kill to first-death diff of the player.
          Values must be integers.
        data_type: int64

  - name: dims_teams
    description: >
      Team dimension containing the standardized identity and regional classification of teams.
      Grain: one row per team.
    columns:
      - name: team_id
        description: >
          Surrogate identifier uniquely assigned to each team.
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: team_name
        description: >
          Standardized full name of the team.
        data_type: string
        data_tests:
          - not_null
      - name: team_alias
        description: >
          Standardized short alias used to identify the team in source data.
        data_type: string
        data_tests:
          - not_null
      - name: team_region
        description: >
          Competitive region associated with the team.
        data_type: string
        data_tests:
          - not_null

  - name: dims_players
    description: >
      Player dimension containing standardized player identities and nationality information.
      Grain: one row per player.
    columns:
      - name: player_id
        description: >
          Surrogate identifier uniquely assigned to each player.
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: player_name
        description: >
          Standardized name of the player.
        data_type: string
        data_tests:
          - not_null
      - name: player_nationality
        description: >
          Nationality associated with the player.
        data_type: string
        data_tests:
          - not_null

  - name: dims_maps
    description: >
      Map dimension containing standardized identifiers and names for maps available in the dataset.
      Grain: one row per map.
    columns:
      - name: map_id
        description: >
          Surrogate identifier uniquely assigned to each map.
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: map_name
        description: >
          Standardized name of the map.
        data_type: string
        data_tests:
          - not_null
          - unique

  - name: dims_agents
    description: >
      Agent dimension containing standardized identifiers and names for playable agents.
      Grain: one row per agent.
    columns:
      - name: agent_id
        description: >
          Surrogate identifier uniquely assigned to each agent.
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: agent_name
        description: >
          Standardized name of the agent.
        data_type: string
        data_tests:
          - not_null
          - unique